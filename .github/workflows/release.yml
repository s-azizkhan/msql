name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      # fixed asset name keeps releases/latest/download/metabase-sql.tgz stable
      - run: mv "$(npm pack | tail -1)" metabase-sql.tgz
      - run: gh release create "$GITHUB_REF_NAME" metabase-sql.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
